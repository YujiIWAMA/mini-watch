name: MINI在庫チェック

on:
  schedule:
    - cron: "10 23 * * *"   # 毎日 8:10 JST
    - cron: "10 10 * * *"   # 毎日 19:10 JST
  workflow_dispatch:         # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: mini-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: 在庫をチェック
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py
      - name: 結果を保存
        run: |
          git config user.name "mini-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json STATUS.md
          git diff --cached --quiet || git commit -m "在庫チェック $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
